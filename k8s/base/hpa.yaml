apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: integration-framework-hpa
  namespace: gke-data-track-foundation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: integration-framework-be
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70