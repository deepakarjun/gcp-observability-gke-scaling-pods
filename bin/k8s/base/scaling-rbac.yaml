apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: gke-data-track-foundation
  name: integration-framework-role
rules:
  # PodInfoService.getRunningPods -> list pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # NamespaceListResponse.getUserNamespaces -> list of user namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
 
  # ScalingService.scale -> update the deployment's scale subresource
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "update", "patch"]

  # PodInfoService.getMinMaxPods / HPA-based scaling -> read & patch HPA
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: gke-data-track-foundation
  name: integration-framework-role-binding
subjects:
  - kind: ServiceAccount
    name: backend-ksa
    namespace: gke-data-track-foundation
roleRef:
  kind: Role
  name: integration-framework-role
  apiGroup: rbac.authorization.k8s.io
