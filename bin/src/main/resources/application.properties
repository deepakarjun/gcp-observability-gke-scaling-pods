spring.application.name=scaling

# GKE log-severity KPI settings
gke.log-severity.thread-pool-size=5
gke.log-severity.max-retries=4
gke.log-severity.initial-backoff-millis=1000
gke.log-severity.backoff-multiplier=2

gke.key-points.namespace-prefixes=${NAME_SPACE_PREFIX}

# PLEASE MAKE SURE TO CREATE METRIC COSTCO ENV
gke.log-severity.metric-type=${SEVERITY_METRIC}

logging.level.org.springframework.web.servlet.PageNotFound=OFF
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

# Kubernetes client mode: LOCAL (gcloud/GKE credentials) or IN_CLUSTER (mounted SA)
kubernetes.client-mode=${KUBERNETES_CLIENT_MODE}
kubernetes.api-base-path=${KUBERNETES_API_BASE_PATH}
kubernetes.ca-cert-path=${KUBERNETES_CLIENT_CERT_PATH}


# Utilization streaming: how often (ms) the SSE endpoint pushes a new sample
gke.utilization.stream-interval-millis=5000
# SSE connection timeout (ms); 0 = no timeout
gke.utilization.stream-timeout-millis=0

# --- Audit datastore (PostgreSQL) ---
# spring.datasource.url=${AUDIT_DB_URL:jdbc:postgresql://10.214.233.3:5432/data-track-foundation-db}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW}

# Flyway manages schema; Hibernate only validates against it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Audit retention ---
# Delete audit entries older than N days
audit.retention.retention-days=90
# Cron for the purge job (default: daily at 02:00)
audit.retention.purge-cron=0 0 2 * * *